name: ManuscriptForge

# Tests the app and builds the Windows and macOS installers. Download the
# installers from the "Artifacts" section of a finished run.
on:
  push:
    paths:
      - 'manuscriptforge/**'
      - '.github/workflows/manuscriptforge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuscriptforge-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: manuscriptforge

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manuscriptforge/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manuscriptforge/src-tauri
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev xvfb dbus
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rust
      - run: npm run build
      - name: Interface test in a browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Desktop smoke test
        run: |
          npx tauri build --debug --no-bundle
          npm run test:desktop

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manuscriptforge/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manuscriptforge/src-tauri
          key: ${{ matrix.name }}
      - run: npm ci
      - name: Build installers
        run: npx tauri build ${{ matrix.args }}
      - name: Launch the built app and run its self-check
        # The Intel build cannot run on an Apple Silicon machine without Rosetta, so it is only built.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          MF_BINARY="$(find src-tauri/target -type f \( -name manuscriptforge.exe -o -name manuscriptforge \) -path '*release*' -not -path '*/bundle/*' -not -path '*/deps/*' | head -n 1)"
          echo "Testing $MF_BINARY"
          MF_BINARY="$MF_BINARY" npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ManuscriptForge-${{ matrix.name }}
          if-no-files-found: error
          path: |
            manuscriptforge/src-tauri/target/**/release/bundle/nsis/*.exe
            manuscriptforge/src-tauri/target/**/release/bundle/msi/*.msi
            manuscriptforge/src-tauri/target/**/release/bundle/dmg/*.dmg
